          "@type": "Question",

          "@type": "Question",

        },

          "@type": "Question",
          "name": "What does iamsweet offer for diabetes management?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "iamsweet offers daily care tracking for blood sugar, mood and medications; 50+ low-GI diabetes meal recipes; a curated library of 100+ resources from credible organizations; a global telehealth directory of diabetes specialists; an AI chat assistant (SWEETY) for instant diabetes questions; educational videos; and an HSA/FSA-eligible product store."
          }
        },

          "@type": "Question",

        }
